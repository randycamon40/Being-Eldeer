<script type="module">
import {initializeApp} from "firebase/app";
import {getFirestore,doc,updateDoc,getDocs,addDoc,deleteDoc,collection,query,where,orderBy,onSnapshot} from "firebase/firestore";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), ls=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb=n=>n>1e6?(n/1e6).toFixed(1)+'MB':Math.round(n/1e3)+'KB';
const dk=t=>new Date(t).toDateString(), rnd=a=>a[Math.random()*a.length|0];
function toast(t){const e=document.createElement('div');e.className='card !mb-0 !py-2 text-sm font-bold';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),2600)}
const A=window.A={};
const S={tab:'home',mem:'gal',play:'games',g:'tot',cat:'Deep Talk',mo:null};
const NAMES=['notes','memories','letters','wishlist','questions','hugs','songs','quiz'];
let me=ls('kb_me'),cid=ls('kb_cid'),C=null,D={},ob={avatar:''},seen=new Set(),boot=Date.now();
NAMES.forEach(n=>D[n]=[]);
let db;try{db=getFirestore(initializeApp(window.firebaseConfig))}catch(e){}
const col=n=>collection(db,'couples',cid,n), cref=()=>doc(db,'couples',cid);
const add=(n,o)=>addDoc(col(n),{from:me.slot,t:Date.now(),...o});
const oSlot=()=>me.slot=='partner1'?'partner2':'partner1', M=()=>C[me.slot]||{}, O=()=>C[oSlot()]||{};
const cn=()=>me.slot=='partner1'?1:2;

/* ---------- PWA: SW eksternal + theme-color dinamis ---------- */
const THEME_BG = { pink:'#ffd9ea', lavender:'#e6dcff', blue:'#d7ecff', matcha:'#dff3d8', sunset:'#ffe4d6', ocean:'#d4f1f9' };
function updateThemeColor(){
  const meta = document.querySelector('meta[name="theme-color"]');
  if(!meta) return;
  const dark = document.body.classList.contains('dark');
  meta.content = dark ? '#1d1530' : (THEME_BG[document.body.dataset.t] || '#ffd9ea');
}
if('serviceWorker' in navigator){
  let refreshing = false;
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadCtrl || refreshing) return;
    refreshing = true;
    location.reload();
  });
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none', scope: '/' })
    .then(reg => {
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange', () => {
        if(!document.hidden) reg.update().catch(()=>{});
      });
      setInterval(() => reg.update().catch(()=>{}), 30 * 60 * 1000);
    })
    .catch(()=>{});
}

/* ---------- KOMPRESI FOTO PINTAR: Canvas -> WebP ---------- */
async function compressImage(file,max=1024,q=.68){
  const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(file)});
  const T=document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg'; // fallback Safari lama
  const go=(m,qq)=>new Promise(r=>{const s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*s|0;c.height=img.height*s|0;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);c.toBlob(r,T,qq)});
  let b=await go(max,q); if(b.size>300e3) b=await go(800,.6); // masih kegedean -> kecilin lagi
  const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
  return {url,before:file.size,after:b.size,pct:Math.max(0,Math.round(100-b.size/file.size*100))};
}

/* ---------- Firestore listeners ---------- */
function listen(){
  onSnapshot(cref(),s=>{C=s.data();if(!C){toast('Couple ga ketemu 🥺');return}render()});
  NAMES.forEach(n=>onSnapshot(query(col(n),orderBy('t')),s=>{D[n]=s.docs.map(d=>({id:d.id,...d.data()}));if(n=='hugs')checkHug();render()}));
}
function checkHug(){const l=D.hugs.at(-1);if(l&&l.from!=me.slot&&l.t>boot&&!seen.has(l.id)){seen.add(l.id);toast(l.type=='hug'?'Sayang ngirim peluk nih! 🤗':'Ada cium nyampe nih! 😘');fx(l.type)}}
function fx(type){const e=type=='hug'?'🤗':'😘',o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;font-size:7rem;pointer-events:none';
  o.innerHTML=Array.from({length:12},(_,i)=>`<span style="position:absolute;left:${(i*8+Math.random()*10)}%;top:${40+Math.random()*30}%;font-size:${2+Math.random()*3}rem;animation:pop 2s ${i*.1}s both">${i%2?'💖':e}</span>`).join('');
  document.body.append(o);setTimeout(()=>o.remove(),3200);
  confetti({particleCount:160,spread:100,origin:{y:.6},colors:['#ff6fa5','#9b7bff','#ffd166']});navigator.vibrate?.([200,100,200]);}

/* ---------- Komponen ---------- */
const av=(p,s=20)=>p?.avatar?`<img src="${p.avatar}" class="w-${s} h-${s} rounded-full object-cover border-4 border-white shadow">`:`<div class="w-${s} h-${s} rounded-full bg-white flex items-center justify-center text-3xl border-4 border-white shadow">🐰</div>`;
const seg=(k,it)=>`<div class="flex gap-1 mb-3 bg-white/40 rounded-2xl p-1">${it.map(([i,l])=>`<button onclick="A.sub('${k}','${i}')" class="flex-1 py-2 rounded-xl text-sm font-bold ${S[k]==i?'btn':''}">${l}</button>`).join('')}</div>`;
const MOODS=[['happy','😊'],['kangen','🥺'],['cape','😮‍💨'],['excited','🤩'],['ngambek','😤'],['manja','🥰'],['bosen','😑'],['lovey','😍']];
const logo=`<svg width="34" height="34" viewBox="0 0 100 100"><path d="M50 86C18 62 12 40 27 27c10-8 20-3 23 7 3-10 13-15 23-7 15 13 9 35-23 52z" fill="var(--a)"/><circle cx="39" cy="47" r="4" fill="#4a2c4a"/><circle cx="61" cy="47" r="4" fill="#4a2c4a"/><circle cx="32" cy="57" r="4" fill="#fff8"/><circle cx="68" cy="57" r="4" fill="#fff8"/><path d="M44 58q6 6 12 0" stroke="#4a2c4a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const head=t=>`<div class="flex items-center gap-2 mb-3 font-extrabold text-xl">${logo} ${t}</div>`;

/* ---------- Views ---------- */
function streak(){const s=new Set([...D.hugs,...D.notes.filter(n=>n.gm)].map(x=>dk(x.t)));let d=new Date(),n=0;if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function nextCall(){const c=C.call;if(!c)return null;const[h,m]=c.time.split(':');let d=new Date();d.setHours(h,m,0,0);d.setDate(d.getDate()+((c.dow-d.getDay()+7)%7));if(d<Date.now())d.setDate(d.getDate()+7);return d}
function cal(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),L=new Date(y,m+1,0).getDate(),meet=C.nextMeetDate?new Date(C.nextMeetDate):null;
  let h='<div class="grid grid-cols-7 text-center text-xs gap-1">'+'MSSRKJS'.split('').map(x=>`<b>${x}</b>`).join('')+'<i></i>'.repeat(f);
  for(let d=1;d<=L;d++){const dt=new Date(y,m,d),isM=meet&&dk(meet)==dk(dt),isC=C.call&&dt.getDay()==C.call.dow,t=d==n.getDate();
    h+=`<div class="py-1 rounded-full ${t?'btn':''}">${d}${isM?'💖':isC?'<br>📞':''}</div>`}return h+'</div>'}
function home(){
  if(!C.partner2)return `${head('Being Eldeer')}<div class="card text-center"><div class="fl text-5xl">💌</div><p class="font-bold mt-2">Nunggu doi join nih~</p><p>Kasih kode ini ke doi:</p><div class="text-4xl font-extrabold tracking-widest my-2" style="color:var(--a)">${C.code}</div></div>`;
  const ms=C.anniversaryDate?Date.now()-new Date(C.anniversaryDate):null,nm=C.nextMeetDate?new Date(C.nextMeetDate)-Date.now():null,o=O(),m=M(),nc=nextCall();
  const tz=p=>p.tz?new Date().toLocaleTimeString('id',{timeZone:p.tz,hour:'2-digit',minute:'2-digit'}):'--:--';
  const hugs=D.hugs.filter(x=>x.type=='hug').length,kiss=D.hugs.length-hugs,ci=n=>C['city'+n]||'?';
  return `${head('Being Eldeer')}
  <div class="card text-center"><div class="flex justify-center items-center gap-3">${av(C.partner1)}<span class="text-3xl fl">💕</span>${av(C.partner2)}</div>
   <div class="font-extrabold mt-2">${esc(C.partner1.name)} & ${esc(C.partner2.name)}</div>
   <div class="mt-2 text-sm">${ms!=null?`Udah bareng <b class="text-2xl" style="color:var(--a)">${ms/864e5|0}</b> hari <b>${ms%864e5/36e5|0}</b> jam 🥰`:'Atur tanggal jadian di Settings ya sayang'}</div></div>
  <div class="card text-center">⏳ Ketemu lagi dalam...<div class="text-2xl font-extrabold" style="color:var(--a)">${nm>0?`${nm/864e5|0} hari ${nm%864e5/36e5|0} jam`:nm==null?'belum diatur':'Hari ini ketemu!! 🎉'}</div>
   ${nc?`<div class="text-sm mt-1">📞 Call berikutnya: ${nc.toLocaleString('id',{weekday:'long',hour:'2-digit',minute:'2-digit'})} (${Math.ceil((nc-Date.now())/36e5)} jam lagi)</div>`:''}</div>
  <div class="grid grid-cols-2 gap-2"><button class="btn text-lg py-4" onclick="A.send('hug')">Kirim Peluk 🤗</button><button class="btn text-lg py-4" onclick="A.send('kiss')">Kirim Cium 😘</button></div>
  <div class="card mt-3 text-center text-sm">🤗 ${hugs} peluk · 😘 ${kiss} cium · 🔥 streak ${streak()} hari</div>
  <div class="card"><b>Mood hari ini</b><div class="grid grid-cols-2 gap-2 text-sm mt-2"><div>${esc(m.name)}: ${m.mood?.e||'—'}<br><i>${esc(m.mood?.txt||'')}</i><br>🕐 ${tz(m)} · ${esc(ci(cn()))}</div><div>${esc(o.name)}: ${o.mood?.e||'—'}<br><i>${esc(o.mood?.txt||'')}</i><br>🕐 ${tz(o)} · ${esc(ci(cn()==1?2:1))}</div></div>
   <div class="flex flex-wrap gap-1 mt-2">${MOODS.map(([n,e])=>`<button class="chip ${S.mo==e?'on':''}" onclick="A.mood('${e}')">${e} ${n}</button>`).join('')}</div>
   <input id="mt" class="in mt-2" placeholder="Kenapa tuh? 1 kalimat aja~"><button class="btn w-full" onclick="A.saveMood()">Update mood</button></div>
  <div class="card"><b>📅 Kalender & jadwal call</b>${cal()}
   <div class="flex gap-1 mt-2"><select id="cd" class="in !mb-0">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map((d,i)=>`<option value="${i}" ${C.call?.dow==i?'selected':''}>${d}</option>`).join('')}</select><input id="ct" type="time" class="in !mb-0" value="${C.call?.time||'20:00'}"><button class="btn" onclick="A.saveCall()">Set</button></div></div>`;
}
function chat(){
  const n=D.notes.map(x=>{
    const mine=x.from==me.slot;
    const time=new Date(x.t).toLocaleTimeString('id',{hour:'2-digit',minute:'2-digit'}).replace('.',':');
    if(x.letter)return `<div class="flex ${mine?'justify-end':'justify-start'} mb-3"><div class="max-w-[85%] card !bg-amber-50/90 text-stone-700 border-2 border-dashed border-amber-300 !p-3 !mb-0"><div class="font-bold text-sm mb-1">💌 Surat dari ${esc(C[x.from]?.name)}</div><p class="whitespace-pre-wrap text-sm" style="font-family:cursive">${esc(x.txt)}</p><div class="text-[9px] opacity-50 mt-2 text-right">${time}</div></div></div>`;
    return `<div class="flex ${mine?'justify-end':'justify-start'} items-end gap-1.5 mb-3">
      ${!mine?`<div class="shrink-0 mb-4">${av(C[x.from],8)}</div>`:''}
      <div class="group relative max-w-[75%] flex flex-col ${mine?'items-end':'items-start'}">
        <div class="px-3.5 py-2.5 rounded-2xl ${mine?'bg-[var(--a)] text-white rounded-br-sm':'bg-white/90 text-stone-700 rounded-bl-sm shadow-sm border border-black/5'}">
          <p class="text-[15px] leading-snug">${esc(x.txt)}</p>
          ${x.tag?`<div class="text-[10px] opacity-80 mt-1 font-bold">#${x.tag}</div>`:''}
        </div>
        <div class="text-[10px] opacity-50 mt-1 flex gap-2 items-center px-1">
          ${time} ${mine?`<button onclick="A.delMsg('${x.id}')" class="hover:text-red-500 transition">🗑️</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  return `${head('Chat')}
  <div id="chat-list" class="chat-scroll overflow-y-auto h-[calc(100vh-280px)] pb-[130px] px-1">
    ${n||'<div class="text-center opacity-50 mt-10"><div class="text-6xl mb-2 fl">💬</div>Belum ada chat.<br>Sapa doi dulu dong!</div>'}
  </div>
  <div class="fixed bottom-[88px] left-1/2 -translate-x-1/2 w-[calc(100%-24px)] max-w-[406px] z-10">
    <div class="flex gap-2 mb-3 overflow-x-auto chat-scroll pb-1 px-1">
      <button class="chip shrink-0 bg-white/70" onclick="A.gm('Good morning sayangkuuu ☀️')">☀️ Pagi</button>
      <button class="chip shrink-0 bg-white/70" onclick="A.gm('Good night sayang, mimpi indah ya 🌙')">🌙 Malam</button>
      <button class="chip shrink-0 bg-white/70" onclick="A.letter()">💌 Surat</button>
      <button class="chip shrink-0 bg-white/70" onclick="A.gm('Kangen bangettt 🥺')">🥺 Kangen</button>
    </div>
    <div class="flex gap-2 mb-3 overflow-x-auto chat-scroll px-1">
      ${['','penting','lucu','kangen'].map(t=>`<button class="chip shrink-0 text-[11px] ${(S.tag||'')==t?'on':'bg-white/70'}" onclick="A.tag('${t}')">${t||'biasa'}</button>`).join('')}
    </div>
    <div class="card !p-2 !mb-0 flex gap-2 items-center shadow-xl !bg-white/95 backdrop-blur-xl border border-white/50">
      <input id="msg" class="flex-1 bg-transparent border-none outline-none text-[15px] px-2" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')A.msg()">
      <button class="btn !px-5 !py-2.5 !rounded-xl shadow-md" onclick="A.msg()">Kirim</button>
    </div>
  </div>`;
}
function mem(){
  let b=seg('mem',[['gal','📸 Galeri'],['cap','💌 Kapsul'],['wl','✨ Wishlist']]);
  if(S.mem=='gal')b+=`<div class="card"><input id="cp" class="in" placeholder="Caption kenangannya...">
      <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-[var(--a)] rounded-2xl cursor-pointer bg-white/40 mb-3 shadow-inner hover:bg-white/60 transition">
        <span class="text-4xl mb-1">📸</span>
        <span class="text-sm font-bold" style="color:var(--a)">Ketuk untuk pilih foto</span>
        <span class="text-[11px] opacity-60 px-4 text-center truncate w-full" id="ph_name">Belum ada foto yang dipilih</span>
        <input id="ph" type="file" accept="image/*" class="hidden" onchange="document.getElementById('ph_name').textContent = this.files[0]?.name || 'Belum ada foto yang dipilih'">
      </label>
      <button class="btn w-full" onclick="A.upMem()">Upload kenangan 📷</button></div>`+
    [...D.memories].reverse().map(x=>`<div class="card !p-2 relative cursor-pointer" onclick="A.openMem('${x.id}')"><img src="${x.img}" class="w-full rounded-2xl object-cover aspect-[4/3]"><div class="p-2 text-sm"><b>${esc(C[x.from]?.name)}</b> · ${new Date(x.t).toLocaleDateString('id')}<br><span class="line-clamp-1 opacity-80">${esc(x.cap)}</span></div><button onclick="event.stopPropagation();A.delMem('${x.id}')" class="absolute top-3 right-3 bg-white/90 backdrop-blur rounded-full w-8 h-8 flex items-center justify-center shadow text-sm">🗑️</button></div>`).join('');
  if(S.mem=='cap')b+=`<div class="card"><textarea id="lt" class="in" rows="4" placeholder="Tulis surat buat doi..."></textarea><label class="text-sm">Baru bisa dibuka tanggal:</label><input id="ld" type="date" class="in"><button class="btn w-full" onclick="A.saveLetter()">Kunci suratnya 🔒</button></div>`+

async function callAI(prompt, fallback){
  const ai=ls('kb_ai');if(!ai?.key)return fallback;
  const H={'Content-Type':'application/json'};
  try{let r,j;
    if(ai.prov=='gemini'){
      r=await fetch(`${ai.base||'https://generativelanguage.googleapis.com/v1beta'}/models/${ai.model}:generateContent?key=${ai.key}`,{method:'POST',headers:H,body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});j=await r.json();return j.candidates[0].content.parts[0].text.trim()}
    if(ai.prov=='anthropic'){
      r=await fetch(`${ai.base||'https://api.anthropic.com/v1'}/messages`,{method:'POST',headers:{...H,'x-api-key':ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:ai.model,max_tokens:200,messages:[{role:'user',content:prompt}]})});j=await r.json();return j.content[0].text.trim()}
    const U={openai:'https://api.openai.com/v1',groq:'https://api.groq.com/openai/v1',openrouter:'https://openrouter.ai/api/v1'}[ai.prov];
    r=await fetch(`${ai.base||U}/chat/completions`,{method:'POST',headers:{...H,Authorization:'Bearer '+ai.key},body:JSON.stringify({model:ai.model,messages:[{role:'user',content:prompt}]})});j=await r.json();return j.choices[0].message.content.trim();
  }catch(e){toast('AI-nya lagi ngambek, pakai lokal dulu ya 🥺');return fallback}
}

    if(!e)return toast('Link-nya ga kebaca sayang 🥺');await add('songs',{embed:e,cap:$('#sc').value||'Lagu ini ngingetin aku sama kamu'})},
  ask:async()=>{toast('AI lagi mikir... ✨');await add('questions',{q:await generateQuestion(S.cat),cat:S.cat,fav:false,ans:{}})},
  fav:(id,v)=>updateDoc(doc(db,'couples',cid,'questions',id),{fav:v}),delQ:async id=>{if(confirm('Hapus pertanyaan ini? 🥺')){await deleteDoc(doc(db,'couples',cid,'questions',id));toast('Pertanyaan dihapus 🗑️')}},
  ans:id=>updateDoc(doc(db,'couples',cid,'questions',id),{['ans.'+me.slot]:$('#a'+id).value}),
  saveProf:async()=>{const u={[me.slot+'.name']:$('#sn').value,['city'+cn()]:$('#sci').value},f=$('#sa').files[0];if(f)u[me.slot+'.avatar']=(await compressImage(f,256,.7)).url;await updateDoc(cref(),u);toast('Berhasil sayang! 💕')},
  saveDates:async()=>{await updateDoc(cref(),{anniversaryDate:$('#sd1').value,nextMeetDate:$('#sd2').value,bday:$('#sd3').value});toast('Tanggalnya udah masuk! 🗓️')},
  theme:t=>{document.body.dataset.t=t;ls('kb_t',t);updateThemeColor()},dark:()=>{document.body.classList.toggle('dark');ls('kb_d',document.body.classList.contains('dark'));updateThemeColor()},
  saveAI:()=>{ls('kb_ai',{prov:$('#ap').value,key:$('#ak').value,model:$('#am').value,base:$('#ab').value,prompt:$('#apr').value});toast('AI udah disimpen (cuma di HP ini) 🔐')},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({couple:C,...D},null,1)],{type:'application/json'}));a.download='kitaberdua.json';a.click()},
  reset:()=>{if(confirm('Yakin reset? Kamu bakal keluar dari couple ini (data di Firebase tetap ada).')){localStorage.clear();location.reload()}}
});

/* ---------- Start ---------- */
if(ls('kb_t'))document.body.dataset.t=ls('kb_t');if(ls('kb_d'))document.body.classList.add('dark');updateThemeColor();
if(me&&cid&&db)listen();render();setInterval(()=>{if(!document.activeElement?.matches('input,textarea'))render()},60000);
</script></body></html>
