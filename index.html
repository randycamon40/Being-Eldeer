  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||rf)return;rf=true;location.reload()});
  navigator.serviceWorker.register('/sw.js',{updateViaCache:'none',scope:'/'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});setInterval(()=>r.update().catch(()=>{}),18e5)}).catch(()=>{})}
async function compressImage(file,max=1024,q=.68){
  const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(file)});
  const T=document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';
  const go=(m,qq)=>new Promise(r=>{const s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s|0;c.height=img.height*s|0;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);c.toBlob(r,T,qq)});
  let b=await go(max,q);if(b.size>300e3)b=await go(800,.6);
  const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
  return {url,before:file.size,after:b.size,pct:Math.max(0,Math.round(100-b.size/file.size*100))}}

const MOODS=[['happy','😊'],['kangen','🥺'],['cape','😮‍💨'],['excited','🤩'],['ngambek','😤'],['manja','🥰'],['bosen','😑'],['lovey','😍']];

function streak(){const s=new Set([...D.hugs,...D.notes.filter(n=>n.gm)].map(x=>dk(x.t)));let d=new Date(),n=0;if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}

function yearly(ds){if(!ds)return null;const b=new Date(ds),n=t0();let d=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(d<n)d.setFullYear(n.getFullYear()+1);return Math.round((d-n)/864e5)}
function monthly(ds){if(!ds)return null;const a=new Date(ds).getDate(),n=t0();let d=new Date(n.getFullYear(),n.getMonth(),a);if(d<n)d=new Date(n.getFullYear(),n.getMonth()+1,a);return Math.round((d-n)/864e5)}

function tzDiff(){const a=M().tz,b=O().tz;if(!a||!b)return null;try{const f=z=>new Date(new Date().toLocaleString('en-US',{timeZone:z}));return Math.round((f(b)-f(a))/18e5)/2}catch(e){return null}}

async function callAI(prompt,fallback){
  const ai=ls('kb_ai');if(!ai?.key)return fallback;const H={'Content-Type':'application/json'};
  try{let r,j;
    if(ai.prov=='gemini'){r=await fetch(`${ai.base||'https://generativelanguage.googleapis.com/v1beta'}/models/${ai.model}:generateContent?key=${ai.key}`,{method:'POST',headers:H,body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});j=await r.json();return j.candidates[0].content.parts[0].text.trim()}
    if(ai.prov=='anthropic'){r=await fetch(`${ai.base||'https://api.anthropic.com/v1'}/messages`,{method:'POST',headers:{...H,'x-api-key':ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:ai.model,max_tokens:200,messages:[{role:'user',content:prompt}]})});j=await r.json();return j.content[0].text.trim()}
    const U={openai:'https://api.openai.com/v1',groq:'https://api.groq.com/openai/v1',openrouter:'https://openrouter.ai/api/v1'}[ai.prov];
    r=await fetch(`${ai.base||U}/chat/completions`,{method:'POST',headers:{...H,Authorization:'Bearer '+ai.key},body:JSON.stringify({model:ai.model,messages:[{role:'user',content:prompt}]})});j=await r.json();return j.choices[0].message.content.trim()
  }catch(e){toast('AI-nya lagi ngambek, pakai lokal dulu ya 🥺');return fallback}}

  nextTodTurn:()=>{updateDoc(cref(),{tod:{phase:'question',turn:oSlot(),q:rnd(TRUTH)}})},

  spin:()=>{let n=0;const i=setInterval(()=>{const s=$('#sp');if(s)s.textContent=rnd(SPIN);const w=$('#sp-wheel');if(w)w.style.transform='rotate('+n*45+'deg)';if(++n>12){clearInterval(i);S.sp=s?.textContent;confetti({particleCount:60,spread:60})}},100)},
  gombal:()=>{S.gb=rnd(GOMBAL);render()},
  aiGombal:async()=>{toast('AI mikir... ✨');S.gb=await callAI('Buat 1 gombalan romantis/lucu bahasa Indonesia untuk pacar, balas HANYA gombalannya.',rnd(GOMBAL));render()},
  mv:async i=>{const t=C.ttt||{b:'---------',turn:'partner1'};if(t.turn!=me.slot){toast('Bukan giliranmu sayang 🥺');return}if(t.b[i]!='-')return;const b=[...t.b];b[i]=me.slot=='partner1'?'X':'O';const nb=b.join(''),w=LINES.find(l=>nb[l[0]]!='-'&&nb[l[0]]==nb[l[1]]&&nb[l[0]]==nb[l[2]]);const u={ttt:{b:nb,turn:(w||!nb.includes('-'))?'done':oSlot()}};if(w)u[`tttScore.${me.slot}`]=(C.tttScore?.[me.slot]||0)+1;await updateDoc(cref(),u)},
  resetTttScore:()=>{if(confirm('Yakin mau reset skor Tic Tac Toe?'))updateDoc(cref(),{tttScore:{partner1:0,partner2:0}})},
  sendTttMsg:async()=>{const t=$('#ttt_msg').value.trim();if(!t)return;$('#ttt_msg').value='';await updateDoc(cref(),{tttChat:{text:t,from:me.slot,t:Date.now()}})},
  tr:()=>updateDoc(cref(),{ttt:{b:'---------',turn:'partner1'}}),
  addQ:async()=>{const q=$('#qq').value.trim(),a=$('#qa').value.trim();if(q&&a){await add('quiz',{q,a,g:''});toast('Terkirim! 🎯')}},
  guess:id=>updateDoc(doc(db,'couples',cid,'quiz',id),{g:$('#g'+id).value}),
  addSong:async()=>{const u=$('#su').value.trim();let e='';
    if(u.includes('spotify.com'))e=u.split('?')[0].replace('open.spotify.com/','open.spotify.com/embed/');
    else{const m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)e='https://www.youtube.com/embed/'+m[1]}
    if(!e)return toast('Link-nya ga kebaca sayang 🥺');await add('songs',{embed:e,cap:$('#sc').value||'Lagu ini ngingetin aku sama kamu'})},
  ask:async()=>{toast('AI lagi mikir... ✨');await add('questions',{q:await generateQuestion(S.cat),cat:S.cat,fav:false,ans:{}})},
  fav:(id,v)=>updateDoc(doc(db,'couples',cid,'questions',id),{fav:v}),
  delQ:async id=>{if(confirm('Hapus pertanyaan ini? 🥺')){await deleteDoc(doc(db,'couples',cid,'questions',id));toast('Pertanyaan dihapus 🗑️')}},
  ans:id=>updateDoc(doc(db,'couples',cid,'questions',id),{['ans.'+me.slot]:$('#a'+id).value}),
  saveProf:async()=>{const u={[me.slot+'.name']:$('#sn').value,['city'+cn()]:$('#sci').value},f=$('#sa').files[0];if(f)u[me.slot+'.avatar']=(await compressImage(f,256,.7)).url;await updateDoc(cref(),u);toast('Berhasil sayang! 💕')},
  saveAppTitle:async()=>{await updateDoc(cref(),{appTitle:$('#s_app_title').value});toast('Nama aplikasi diupdate! ✨')},
  toggleVibe:v=>{ls('kb_vibe',v);toast(v?'Efek getar dinyalakan 📳':'Efek getar dimatikan 🔕')},
  saveDates:async()=>{await updateDoc(cref(),{anniversaryDate:$('#sd1').value,nextMeetDate:$('#sd2').value,bday:$('#sd3').value});toast('Tanggalnya udah masuk! 🗓️')},
  theme:t=>{document.body.dataset.t=t;ls('kb_t',t);localStorage.removeItem('kb_ac');applyAccent();updateThemeColor();render()},
  dark:()=>{document.body.classList.toggle('dark');ls('kb_d',document.body.classList.contains('dark'));updateThemeColor()},
  saveAI:()=>{ls('kb_ai',{prov:$('#ap').value,key:$('#ak').value,model:$('#am').value,base:$('#ab').value,prompt:$('#apr').value});toast('AI udah disimpen (cuma di HP ini) 🔐')},
  testAI:async()=>{const st=$('#ai-status'),k=$('#ak').value.trim();if(!k){st.innerHTML='<span style="color:#e5484d">❌ API Key kosong</span>';return}st.innerHTML='<span class="fl">⏳ Menghubungkan...</span>';
    const prov=$('#ap').value,model=$('#am').value||'gpt-4o-mini',base=$('#ab').value,H={'Content-Type':'application/json'};
    try{let r,j;
      if(prov=='gemini'){r=await fetch(`${base||'https://generativelanguage.googleapis.com/v1beta'}/models/${model}:generateContent?key=${k}`,{method:'POST',headers:H,body:JSON.stringify({contents:[{parts:[{text:'Halo, balas satu kata: OK'}]}]})})}
      else if(prov=='anthropic'){r=await fetch(`${base||'https://api.anthropic.com/v1'}/messages`,{method:'POST',headers:{...H,'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:10,messages:[{role:'user',content:'Halo, balas satu kata: OK'}]})})}
      else{const U={openai:'https://api.openai.com/v1',groq:'https://api.groq.com/openai/v1',openrouter:'https://openrouter.ai/api/v1'}[prov];r=await fetch(`${base||U}/chat/completions`,{method:'POST',headers:{...H,Authorization:'Bearer '+k},body:JSON.stringify({model,messages:[{role:'user',content:'Halo, balas satu kata: OK'}]})})}
      j=await r.json();if(j.error)throw new Error(j.error.message);
      st.innerHTML='<span style="color:#3fa66b">✅ Terhubung & siap!</span>';toast('Koneksi AI berhasil! 🎉')
    }catch(e){st.innerHTML=`<span style="color:#e5484d">❌ Gagal: ${esc(e.message.slice(0,30))}...</span>`;toast('Koneksi AI gagal 🥺')}},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({couple:C,...D},null,1)],{type:'application/json'}));a.download='kitaberdua.json';a.click()},
  reset:()=>{if(confirm('Yakin reset? Kamu bakal keluar dari couple ini (data di Firebase tetap ada).')){localStorage.clear();location.reload()}}
});
if(ls('kb_t'))document.body.dataset.t=ls('kb_t');if(ls('kb_d'))document.body.classList.add('dark');applyAccent();updateThemeColor();setTimeout(askNotif, 5000);
if(me&&cid&&db)listen();render();loadStickers();
const updatePresence=()=>{if(me&&cid&&db)updateDoc(cref(),{[me.slot+'.lastActive']:Date.now()}).catch(()=>{})};
updatePresence();setInterval(updatePresence,60000);
setInterval(()=>{if(!document.activeElement?.matches('input,textarea'))render()},60000);
</script></body></html>
